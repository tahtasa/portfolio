<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:#1C1C1C}</style></head><body><div id="root"></div>
<script type="text/babel">
const { CursorCharacter } = window.VenturCityDesignSystem_a97b28;
const people=[['Mia','orange',['Best coffee on this street','Saving this one!']],['Leo','red',['Who is coming tonight?']],['Ana','blue',['Partner deal here','Try the ramen']],['Kai','green',['Been here 5 times']]];
function Demo({name,color,msgs,delay}){
  const [m,setM]=React.useState(undefined);const i=React.useRef(0);
  React.useEffect(()=>{const t=setTimeout(()=>setM(msgs[0]),delay);return()=>clearTimeout(t)},[]);
  const done=()=>{setM(undefined);setTimeout(()=>{i.current=(i.current+1)%msgs.length;setM(msgs[i.current])},2200)};
  return <CursorCharacter name={name} color={color} message={m} onDone={done}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(
<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,alignItems:'start'}}>
 {people.map(([n,c,ms],k)=><Demo key={n} name={n} color={c} msgs={ms} delay={400+k*1300}/>)}
</div>);
</script></body></html>
