<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--black-120);background:#fff}.row{display:flex;gap:0;border:1px solid var(--black-0);border-radius:8px;overflow:hidden}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:var(--sm-medium);padding:6px 6px 0}.sw s{display:block;text-decoration:none;font:var(--sm-regular);color:var(--black-5);padding:0 6px 6px}.sw+.sw{border-left:1px solid var(--black-0)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--text-brand)"></i><b>brand</b><s>green.100</s></div><div class="sw"><i style="background:var(--text-primary-light)"></i><b>primary-light</b><s>green.0</s></div><div class="sw"><i style="background:var(--text-primary-dark)"></i><b>primary-dark</b><s>black.120</s></div><div class="sw"><i style="background:var(--text-hint-light)"></i><b>hint-light</b><s>black.0</s></div><div class="sw"><i style="background:var(--text-hint-dark)"></i><b>hint-dark</b><s>black.20</s></div><div class="sw"><i style="background:var(--text-secondary)"></i><b>secondary</b><s>black.5</s></div><div class="sw"><i style="background:var(--text-success)"></i><b>success</b><s>green.120</s></div><div class="sw"><i style="background:var(--text-warn)"></i><b>warn</b><s>orange.120</s></div><div class="sw"><i style="background:var(--text-danger)"></i><b>danger</b><s>red.120</s></div><div class="sw"><i style="background:var(--text-info)"></i><b>info</b><s>blue.120</s></div><div class="sw"><i style="background:var(--stroke-primary-dark)"></i><b>primary-dark</b><s>black.100</s></div></div></body></html>
