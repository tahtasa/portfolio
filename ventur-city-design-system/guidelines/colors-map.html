<!-- @dsCard group="Colors" viewport="700x250" name="Map palette" subtitle="--map-light-* / --map-dark-* (tokens/map.css)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--black-120);display:flex;flex-direction:column;gap:12px}.row{display:flex;border:1px solid var(--black-0);border-radius:8px;overflow:hidden}.sw{flex:1;min-width:0}.sw i{display:block;height:52px}.sw b{display:block;font:var(--sm-medium);padding:6px 6px 0}.sw s{display:block;text-decoration:none;font:var(--sm-regular);color:var(--black-5);padding:0 6px 6px}.sw+.sw{border-left:1px solid var(--black-0)}</style></head><body>
<div class="row"><div class="sw"><i style="background:var(--map-light-land)"></i><b>land</b><s>green.0</s></div><div class="sw"><i style="background:var(--map-light-building)"></i><b>building</b><s>green.5</s></div><div class="sw"><i style="background:var(--map-light-road-minor)"></i><b>road-minor</b><s>green.15</s></div><div class="sw"><i style="background:var(--map-light-road-major)"></i><b>road-major</b><s>green.20</s></div><div class="sw"><i style="background:var(--map-light-park)"></i><b>park</b><s>green.50</s></div><div class="sw"><i style="background:var(--map-light-water)"></i><b>water</b><s>blue.50 tint</s></div><div class="sw"><i style="background:var(--map-light-waterway)"></i><b>waterway</b><s>blue.50</s></div></div>
<div class="row"><div class="sw"><i style="background:var(--map-dark-land)"></i><b>land</b><s>black.120</s></div><div class="sw"><i style="background:var(--map-dark-building)"></i><b>building</b><s>black.100</s></div><div class="sw"><i style="background:var(--map-dark-road-minor)"></i><b>road-minor</b><s>black.50</s></div><div class="sw"><i style="background:var(--map-dark-road-major)"></i><b>road-major</b><s>black.30</s></div><div class="sw"><i style="background:var(--map-dark-park)"></i><b>park</b><s>green.120 shade</s></div><div class="sw"><i style="background:var(--map-dark-water)"></i><b>water</b><s>blue.120 shade</s></div><div class="sw"><i style="background:var(--map-dark-waterway)"></i><b>waterway</b><s>blue.120 shade</s></div></div>
</body></html>
