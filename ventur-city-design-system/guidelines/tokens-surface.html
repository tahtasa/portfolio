<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--black-120);background:#fff}.row{display:flex;gap:0;border:1px solid var(--black-0);border-radius:8px;overflow:hidden}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:var(--sm-medium);padding:6px 6px 0}.sw s{display:block;text-decoration:none;font:var(--sm-regular);color:var(--black-5);padding:0 6px 6px}.sw+.sw{border-left:1px solid var(--black-0)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--surface-brand)"></i><b>brand</b><s>green.100</s></div><div class="sw"><i style="background:var(--surface-brand-hover)"></i><b>brand-hover</b><s>green.70</s></div><div class="sw"><i style="background:var(--surface-brand-disable)"></i><b>brand-disable</b><s>green.50</s></div><div class="sw"><i style="background:var(--surface-light)"></i><b>light</b><s>green.0</s></div><div class="sw"><i style="background:var(--surface-light-hover)"></i><b>light-hover</b><s>green.5</s></div><div class="sw"><i style="background:var(--surface-dark)"></i><b>dark</b><s>black.120</s></div><div class="sw"><i style="background:var(--surface-dark-hover)"></i><b>dark-hover</b><s>black.100</s></div><div class="sw"><i style="background:var(--surface-void)"></i><b>void</b><s>black.150</s></div></div></body></html>
