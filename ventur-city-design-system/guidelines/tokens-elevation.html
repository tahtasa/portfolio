<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--black-120);background:#fff}.row{display:flex;gap:0;border:1px solid var(--black-0);border-radius:8px;overflow:hidden}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:var(--sm-medium);padding:6px 6px 0}.sw s{display:block;text-decoration:none;font:var(--sm-regular);color:var(--black-5);padding:0 6px 6px}.sw+.sw{border-left:1px solid var(--black-0)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--elevation-light-0)"></i><b>light-0</b><s>green.0</s></div><div class="sw"><i style="background:var(--elevation-light-1)"></i><b>light-1</b><s>green.5</s></div><div class="sw"><i style="background:var(--elevation-light-2)"></i><b>light-2</b><s>green.10</s></div><div class="sw"><i style="background:var(--elevation-light-3)"></i><b>light-3</b><s>green.15</s></div><div class="sw"><i style="background:var(--elevation-light-4)"></i><b>light-4</b><s>green.20</s></div><div class="sw"><i style="background:var(--elevation-dark-0)"></i><b>dark-0</b><s>black.120</s></div><div class="sw"><i style="background:var(--elevation-dark-1)"></i><b>dark-1</b><s>black.100</s></div><div class="sw"><i style="background:var(--elevation-dark-2)"></i><b>dark-2</b><s>black.70</s></div><div class="sw"><i style="background:var(--elevation-dark-3)"></i><b>dark-3</b><s>black.50</s></div><div class="sw"><i style="background:var(--elevation-dark-4)"></i><b>dark-4</b><s>black.30</s></div><div class="sw"><i style="background:var(--elevation-dark-5)"></i><b>dark-5</b><s>black.20</s></div></div></body></html>
